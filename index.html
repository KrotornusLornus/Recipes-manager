<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipe Manager</title>
</head>

<body>
		
  <h1 id="titulo">Recipe Manager</h1>

<button id="add-recipe">Añadir receta</button>

<section id="recipes-panel">

  <h2>Mis recetas:</h2>

</section>


<section id="list-active-ingredients">
  <h2>Ingredientes activos:</h2>
  <ul id="list-ingredients"></ul>
</section>






<dialog id="form-dialog">
<form id="recipe-form">
  <input name="recipe-name" placeholder="Nombre" required>
  <input name="recipe-image" type="url" placeholder="URL de imagen">

  <div id="ingredients-container">
    <!-- fila inicial ya visible -->
    <div class="ing-row">
      <input name="ing-name" placeholder="Ingrediente" required>
      <input name="ing-prop" type="number" placeholder="Proporción" step="0.01" required>
    </div>
  </div>

  <button type="button" id="add-ingredient">+ Añadir ingrediente</button>

  <button type="submit">Guardar</button>
  <button type="button" id="cancel-btn">Cancelar</button>
</form>
</dialog>



<script src="app.js" type="module"></script>
</body>

</html>
